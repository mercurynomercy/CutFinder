<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutFinder — 日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --bg-canvas: #EEF0F3;
  --surface-1: #FFFFFF;
  --surface-2: #F6F7F9;
  --surface-3: #E4E7EC;
  --border: #D8DCE2;
  --border-strong: #BCC2CB;
  --text-primary: #1A1D21;
  --text-secondary: #4B5563;
  --text-muted: #6B7280;
  --primary: #5256E0;
  --primary-fg: #FFFFFF;
  --success: #15803D;
  --warning: #B45309;
  --error: #DC2626;
  --radius-sm: 6px;
  --radius-md: 8px;
  --font-ui: "Inter", "PingFang SC", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
}

[data-theme="dark"] {
  --bg-canvas: #0E0F11;
  --surface-1: #16181B;
  --surface-2: #1E2125;
  --surface-3: #282C31;
  --border: #2E333A;
  --border-strong: #3A4048;
  --text-primary: #F2F4F7;
  --text-secondary: #A4ACB9;
  --text-muted: #6B7280;
  --primary: #6366F1;
  --primary-fg: #FFFFFF;
  --success: #22C55E;
  --warning: #F59E0B;
  --error: #EF4444;
}

body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: 1.35; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── Top Bar ── */
.topbar {
  display: flex; align-items: center; gap: 12px;
  height: 48px; padding: 0 16px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 100;
}
.topbar-back {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  font-size: var(--text-sm); font-weight: 500;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: background 150ms;
}
.topbar-back:hover { background: var(--surface-3); color: var(--text-primary); }
.topbar-title {
  font-size: var(--text-lg); font-weight: 600;
  letter-spacing: -0.01em; color: var(--text-primary);
}
.topbar-spacer { flex: 1; }
.topbar-theme-toggle {
  width: 32px; height: 32px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); color: var(--text-secondary);
  transition: background 150ms;
}
.topbar-theme-toggle:hover { background: var(--surface-3); color: var(--text-primary); }

/* ── Page ── */
.page { max-width: 900px; margin: 0 auto; padding: 24px; }

/* ── Toolbar ── */
.log-toolbar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px;
}
.log-filter {
  height: 32px; padding: 0 10px;
  display: flex; align-items: center; gap: 4px;
  font-size: var(--text-xs); font-weight: 500;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  background: var(--surface-2);
  border: 1px solid var(--border);
  transition: background 150ms, color 150ms;
}
.log-filter:hover { background: var(--surface-3); }
.log-filter.active {
  background: var(--primary); color: var(--primary-fg);
  border-color: var(--primary);
}
.log-filter:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--primary);
}
.log-spacer { flex: 1; }
.log-clear-btn {
  height: 32px; padding: 0 10px;
  font-size: var(--text-xs); font-weight: 500;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  border: 1px solid var(--border);
  background: var(--surface-2);
  transition: background 150ms;
}
.log-clear-btn:hover { background: var(--surface-3); color: var(--text-secondary); }

/* ── Log Container ── */
.log-container {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.log-entry {
  display: flex;
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.6;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.log-entry:last-child { border-bottom: none; }
.log-time {
  color: var(--text-muted);
  flex-shrink: 0;
  min-width: 72px;
}
.log-level {
  flex-shrink: 0;
  min-width: 48px;
  font-weight: 600;
  text-align: center;
  border-radius: 3px;
  padding: 0 4px;
  height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-xs);
}
.log-level-info { background: var(--primary-soft); color: var(--primary); }
.log-level-warn { background: rgba(180, 83, 9, 0.1); color: var(--warning); }
.log-level-error { background: rgba(220, 38, 38, 0.1); color: var(--error); }
.log-level-scan { background: rgba(15, 118, 110, 0.1); color: var(--success); }
.log-msg { color: var(--text-secondary); word-break: break-all; flex: 1; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

.icon-md { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="app">
  <!-- ── Top Bar ── -->
  <header class="topbar">
    <a href="settings.html" class="topbar-back">
      <svg class="icon-md" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M10 4L6 8l4 4"/>
      </svg>
      返回
    </a>
    <span class="topbar-title">日志</span>
    <span class="topbar-spacer"></span>
    <button class="topbar-theme-toggle" id="themeToggle" aria-label="切换主题">
      <svg class="icon-md sun-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="display:none">
        <circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/>
      </svg>
      <svg class="icon-md moon-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/>
      </svg>
    </button>
  </header>

  <!-- ── Page ── -->
  <main class="page">
    <div class="log-toolbar" data-od-id="log-toolbar">
      <button class="log-filter active" data-level="all">全部</button>
      <button class="log-filter" data-level="info">INFO</button>
      <button class="log-filter" data-level="warn">WARN</button>
      <button class="log-filter" data-level="error">ERROR</button>
      <button class="log-filter" data-level="scan">扫描</button>
      <span class="log-spacer"></span>
      <button class="log-clear-btn" id="clear-logs">清空</button>
    </div>

    <div class="log-container" id="log-container" data-od-id="log-container">
      <!-- Log entries will be rendered here -->
    </div>
  </main>
</div>

<script>
// ── Theme Toggle ──
(function() {
  var stored = localStorage.getItem('cutfinder-theme');
  if (stored === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    updateIcons(true);
  }
  function updateIcons(dark) {
    document.querySelector('.sun-icon').style.display = dark ? '' : 'none';
    document.querySelector('.moon-icon').style.display = dark ? 'none' : '';
  }
  document.getElementById('themeToggle').addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('cutfinder-theme', next);
    updateIcons(!isDark);
  });
})();

// ── Log Data (mock — in real app, this comes from backend) ──
var logEntries = [
  { time: '14:32:01', level: 'info', msg: 'OMLX 服务已连接 (http://localhost:1235/v1)' },
  { time: '14:32:01', level: 'info', msg: '语音引擎: Qwen3-ASR + ForcedAligner' },
  { time: '14:32:02', level: 'scan', msg: '扫描 /Users/jianhengpan/CNE，发现 45 个视频文件' },
  { time: '14:32:03', level: 'info', msg: '开始处理: A-0001.MP4 (245 MB, 00:19)' },
  { time: '14:32:05', level: 'info', msg: 'A-0001.MP4 转写完成，提取 12 个字幕片段' },
  { time: '14:32:08', level: 'info', msg: 'A-0001.MP4 标签生成完成: Express票, 人山人海, 排队体验' },
  { time: '14:32:10', level: 'scan', msg: '关键帧建议已自动为 A-0001.MP4 生成 3 个片段' },
  { time: '14:32:11', level: 'info', msg: '开始处理: A-0002.MP4 (128 MB, 00:39)' },
  { time: '14:32:15', level: 'info', msg: 'A-0002.MP4 转写完成，提取 18 个字幕片段' },
  { time: '14:32:18', level: 'warn', msg: 'A-0002.MP4 音频质量偏低，建议检查录音设备' },
  { time: '14:32:20', level: 'info', msg: 'A-0002.MP4 标签生成完成: 快速通道, 手环领取, 排队实况' },
  { time: '14:32:22', level: 'scan', msg: '关键帧建议已自动为 A-0002.MP4 生成 4 个片段' },
  { time: '14:32:23', level: 'info', msg: '开始处理: B-0001.MP4 (89 MB, 00:15)' },
  { time: '14:32:25', level: 'info', msg: 'B-0001.MP4 视觉分析完成，识别 2 个 B-roll 类别' },
  { time: '14:32:26', level: 'info', msg: 'B-0001.MP4 标签生成完成: CN塔, 人群, 城市天际线' },
  { time: '14:32:28', level: 'error', msg: 'A-0027.MP4 处理失败: 文件损坏或格式不支持' },
  { time: '14:32:29', level: 'info', msg: '跳过 A-0027.MP4，继续处理下一个' },
  { time: '14:32:30', level: 'scan', msg: '扫描完成: 43/45 成功，2 个跳过' },
  { time: '14:32:30', level: 'info', msg: '素材库已更新: 43 个视频，290 个标签' },
];

var currentFilter = 'all';
var logContainer = document.getElementById('log-container');

function renderLogs() {
  var filtered = currentFilter === 'all'
    ? logEntries
    : logEntries.filter(function(e) { return e.level === currentFilter; });

  if (filtered.length === 0) {
    logContainer.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:var(--text-sm);">没有匹配的日志</div>';
    return;
  }

  logContainer.innerHTML = filtered.map(function(entry) {
    var levelClass = 'log-level-' + entry.level;
    var levelLabel = entry.level.toUpperCase();
    return '<div class="log-entry" data-level="' + entry.level + '">' +
      '<span class="log-time">' + entry.time + '</span>' +
      '<span class="log-level ' + levelClass + '">' + levelLabel + '</span>' +
      '<span class="log-msg">' + entry.msg + '</span>' +
    '</div>';
  }).join('');
}

// ── Filter Buttons ──
var filters = document.querySelectorAll('.log-filter');
filters.forEach(function(btn) {
  btn.addEventListener('click', function() {
    filters.forEach(function(f) { f.classList.remove('active'); });
    this.classList.add('active');
    currentFilter = this.getAttribute('data-level');
    renderLogs();
  });
});

// ── Clear Logs ──
document.getElementById('clear-logs').addEventListener('click', function() {
  logEntries = [];
  renderLogs();
});

// ── Initial Render ──
renderLogs();
</script>
</body>
</html>
