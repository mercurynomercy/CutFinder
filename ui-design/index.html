<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutFinder — 启动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --bg-canvas: #EEF0F3;
  --surface-1: #FFFFFF;
  --surface-2: #F6F7F9;
  --surface-3: #E4E7EC;
  --border: #D8DCE2;
  --text-primary: #1A1D21;
  --text-secondary: #4B5563;
  --text-muted: #6B7280;
  --primary: #5256E0;
  --primary-hover: #4146C4;
  --primary-fg: #FFFFFF;
  --primary-soft: rgba(82, 86, 224, 0.12);
  --roll-a: #B45309;
  --roll-b: #0F766E;
  --roll-photo: #BE185D;
  --success: #15803D;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-1: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-2: 0 8px 24px rgba(0,0,0,0.08);
  --font-ui: "Inter", "PingFang SC", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: #0E0F11;
  --surface-1: #16181B;
  --surface-2: #1E2125;
  --surface-3: #282C31;
  --border: #2E333A;
  --text-primary: #F2F4F7;
  --text-secondary: #A4ACB9;
  --text-muted: #6B7280;
  --primary: #6366F1;
  --primary-hover: #7077F2;
  --primary-fg: #FFFFFF;
  --primary-soft: rgba(99, 102, 241, 0.15);
  --roll-a: #F59E0B;
  --roll-b: #2DD4BF;
  --roll-photo: #F472B6;
  --success: #22C55E;
  --shadow-1: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-2: 0 8px 24px rgba(0,0,0,0.4);
}

body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

h1, h2, h3 { line-height: 1.35; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.launcher {
  max-width: 640px; width: 100%;
  text-align: center;
}

.launcher-logo {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 8px;
}
.launcher-logo-icon {
  width: 48px; height: 48px;
  background: var(--primary);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
}
.launcher-logo-icon svg { width: 24px; height: 24px; }
.launcher-title {
  font-size: var(--text-3xl); font-weight: 600;
  letter-spacing: -0.02em;
}
.launcher-subtitle {
  font-size: var(--text-md); color: var(--text-secondary);
  margin-bottom: 40px;
}

.screen-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 500px) {
  .screen-grid { grid-template-columns: 1fr; }
}

.screen-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  text-align: left;
  transition: box-shadow 150ms, border-color 150ms, transform 150ms;
  display: flex; flex-direction: column; gap: 8px;
}
.screen-card:hover {
  box-shadow: var(--shadow-2);
  border-color: var(--border);
  transform: translateY(-2px);
}
.screen-card:focus-within {
  box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--primary);
}
.screen-card-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
}
.screen-card-icon svg { width: 20px; height: 20px; }
.screen-card-icon-gallery { background: var(--primary-soft); color: var(--primary); }
.screen-card-icon-settings { background: var(--surface-3); color: var(--text-secondary); }
.screen-card-icon-tasks { background: rgba(21, 128, 61, 0.1); color: var(--success); }
.screen-card-icon-cut { background: rgba(15, 118, 110, 0.1); color: var(--roll-b); }
.screen-card-icon-subtitles { background: rgba(190, 24, 93, 0.1); color: var(--roll-photo); }

.screen-card-title {
  font-size: var(--text-lg); font-weight: 600;
}
.screen-card-desc {
  font-size: var(--text-sm); color: var(--text-secondary);
  line-height: 1.5;
  flex: 1;
}
.screen-card-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--text-sm); font-weight: 500;
  color: var(--primary);
  padding: 4px 0;
  transition: gap 150ms;
}
.screen-card:hover .screen-card-link { gap: 8px; }
.screen-card-link svg { width: 14px; height: 14px; transition: transform 150ms; }
.screen-card:hover .screen-card-link svg { transform: translateX(2px); }

.icon-sm { width: 16px; height: 16px; flex-shrink: 0; }
.icon-md { width: 20px; height: 20px; flex-shrink: 0; }

.theme-toggle {
  position: fixed; top: 16px; right: 16px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: background 150ms, color 150ms;
}
.theme-toggle:hover { background: var(--surface-3); color: var(--text-primary); }
.theme-toggle:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--primary);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="切换主题">
  <svg class="icon-md sun-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="display:none">
    <circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/>
  </svg>
  <svg class="icon-md moon-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/>
  </svg>
</button>

<div class="launcher" data-od-id="launcher">
  <div class="launcher-logo">
    <div class="launcher-logo-icon">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="16" height="16" rx="4" fill="white" opacity="0.2"/>
        <path d="M7 7.5L13 10L7 12.5V7.5Z" fill="white"/>
      </svg>
    </div>
    <h1 class="launcher-title">CutFinder</h1>
  </div>
  <p class="launcher-subtitle">AI 驱动的短视频素材管理与初剪工具</p>

  <div class="screen-grid">
    <!-- 主页 -->
    <a href="home.html" class="screen-card" data-od-id="card-home">
      <div class="screen-card-icon screen-card-icon-gallery">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/>
          <rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>
        </svg>
      </div>
      <span class="screen-card-title">素材库</span>
      <span class="screen-card-desc">浏览、筛选和管理所有已扫描的素材片段</span>
      <span class="screen-card-link">
        打开
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </span>
    </a>

    <!-- 设置 -->
    <a href="settings.html" class="screen-card" data-od-id="card-settings">
      <div class="screen-card-icon screen-card-icon-settings">
        <svg class="icon-md" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.49l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"></path><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </div>
      <span class="screen-card-title">设置</span>
      <span class="screen-card-desc">配置 OMLX 连接、语音引擎、处理选项等</span>
      <span class="screen-card-link">
        打开
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </span>
    </a>

    <!-- 任务队列 -->
    <a href="tasks.html" class="screen-card" data-od-id="card-tasks">
      <div class="screen-card-icon screen-card-icon-tasks">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6h12"/>
        </svg>
      </div>
      <span class="screen-card-title">任务队列</span>
      <span class="screen-card-desc">查看扫描、关键帧、初剪等任务状态与进度</span>
      <span class="screen-card-link">
        打开
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </span>
    </a>

    <!-- 初剪 -->
    <a href="rough-cut.html" class="screen-card" data-od-id="card-cut">
      <div class="screen-card-icon screen-card-icon-cut">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M3 4h10M3 8h10M3 12h6"/>
        </svg>
      </div>
      <span class="screen-card-title">初剪</span>
      <span class="screen-card-desc">AI 对话驱动，自动生成分镜表与剪辑方案</span>
      <span class="screen-card-link">
        打开
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </span>
    </a>

    <!-- 字幕导出 -->
    <a href="subtitles.html" class="screen-card" data-od-id="card-subtitles">
      <div class="screen-card-icon screen-card-icon-subtitles">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 6.5h1.5M9 6.5h2M5 9h6M5 11h4"/>
        </svg>
      </div>
      <span class="screen-card-title">字幕导出</span>
      <span class="screen-card-desc">从已转录音频中导出 iTT / SRT 字幕文件</span>
      <span class="screen-card-link">
        打开
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </span>
    </a>
  </div>
</div>

<script>
(function() {
  var stored = localStorage.getItem('cutfinder-theme');
  if (stored === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    updateIcons(true);
  }
  function updateIcons(dark) {
    document.querySelector('.sun-icon').style.display = dark ? '' : 'none';
    document.querySelector('.moon-icon').style.display = dark ? 'none' : '';
  }
  document.getElementById('themeToggle').addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('cutfinder-theme', next);
    updateIcons(!isDark);
  });
})();
</script>
</body>
</html>
